name: refx-bot

# Default `docker compose up` brings up Postgres + Redis (Phase 0 acceptance
# target). The bot and dashboard sit
# behind the `apps` profile and are built/run with:
#   docker compose --profile apps up --build
# Run migrations against the running Postgres with `pnpm db:deploy`.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-refx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-refx}
      POSTGRES_DB: ${POSTGRES_DB:-refx}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-refx} -d ${POSTGRES_DB:-refx}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    restart: unless-stopped
    profiles: ['apps']
    env_file: .env
    # In-container the DB/Redis hosts are the compose service names,
    # not the `localhost` values inherited from .env. Explicit `environment`
    # entries take precedence over `env_file`.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-refx}:${POSTGRES_PASSWORD:-refx}@postgres:5432/${POSTGRES_DB:-refx}?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Nightly logical backups of Postgres to the `postgres-backups` volume, with
  # rolling retention. Restore with `scripts/restore-db.sh` (see its header).
  # Set BACKUP_S3_* in .env to also push every dump to an S3-compatible store
  # (R2/B2/S3/MinIO); otherwise copy off-host manually with:
  #   docker compose cp backup:/backups ./backups
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: ['apps']
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-refx}
      POSTGRES_USER: ${POSTGRES_USER:-refx}
      POSTGRES_DB: ${POSTGRES_DB:-refx}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      # Offsite push (scripts/backup-loop.sh) — inactive while the bucket is
      # empty. rclone reads the RCLONE_S3_* names directly.
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-refx-bot}
      BACKUP_S3_RETENTION_DAYS: ${BACKUP_S3_RETENTION_DAYS:-30}
      RCLONE_S3_PROVIDER: ${BACKUP_S3_PROVIDER:-Other}
      RCLONE_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      RCLONE_S3_REGION: ${BACKUP_S3_REGION:-}
      RCLONE_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      RCLONE_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
    entrypoint: ['/bin/sh', '/backup-loop.sh']
    volumes:
      - ./scripts/backup-loop.sh:/backup-loop.sh:ro
      - postgres-backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # Instance branding, baked into the dashboard bundle at build time.
      args:
        NEXT_PUBLIC_BRAND_NAME: ${BRAND_NAME:-}
        NEXT_PUBLIC_BRAND_COMMUNITY: ${BRAND_COMMUNITY:-}
        NEXT_PUBLIC_BRAND_COLOR: ${BRAND_COLOR:-}
        NEXT_PUBLIC_BRAND_FOOTER: ${BRAND_FOOTER:-}
        NEXT_PUBLIC_BRAND_LOGO: ${BRAND_LOGO:-}
        NEXT_PUBLIC_FEATURE_FIVEM: ${FEATURE_FIVEM:-}
    restart: unless-stopped
    profiles: ['apps']
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-refx}:${POSTGRES_PASSWORD:-refx}@postgres:5432/${POSTGRES_DB:-refx}?schema=public
      REDIS_URL: redis://redis:6379
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
    ports:
      - '${WEB_PORT:-3000}:3000'
    healthcheck:
      # Node 20 has global fetch; a 2xx from the health route means the
      # app is actually serving (a hung-but-running process shows "unhealthy").
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  postgres-backups:
  redis-data:
