name: refx-bot

# Production overlay for the VPS. Layer it on top of the base compose file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     --profile apps up -d --build
#
# Nothing here is reachable from the internet. The dashboard (127.0.0.1:3000)
# and the FiveM whitelist API (127.0.0.1:30125) bind to loopback, and a
# Cloudflare Tunnel on the host publishes them over HTTPS (see SETUP.md,
# "Cloudflare Tunnel"), so no inbound port is ever opened on the VPS.
#
# `restart: unless-stopped` on every service (base file) gives you the keep-alive:
# the stack comes back on VPS reboot / crash without any systemd unit.

services:
  # The base file hardcodes REDIS_URL=redis://redis:6379 (no auth) in each app's
  # `environment`, which overrides `.env`. Once Redis requires a password (below)
  # the apps must present it, so re-inject the authenticated URL here. compose
  # merges `environment` per-key, so DATABASE_URL/AUTH_URL from the base survive.
  # (Use a URL-safe REDIS_PASSWORD — `openssl rand -hex 32` is ideal.)
  bot:
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env for production}@redis:6379
      # Inside the container the API must listen on all interfaces; the port
      # mapping below is what keeps it on the host's loopback.
      FIVEM_API_HOST: 0.0.0.0
    ports:
      - '127.0.0.1:${FIVEM_API_PORT:-30125}:${FIVEM_API_PORT:-30125}'

  # Only reachable from the host itself; the tunnel reaches it via loopback.
  web:
    ports: !override
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env for production}@redis:6379

  # Data stores must NEVER be publicly reachable. A published Docker port binds
  # 0.0.0.0 and inserts iptables rules in the DOCKER chain that bypass a host
  # ufw/firewall, so the base file's `5432:5432` / `6379:6379` would expose them
  # to the internet on a public VPS. Bind to loopback only (the app containers
  # still reach them over the compose network by service name, unaffected).
  postgres:
    ports: !override
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'

  redis:
    ports: !override
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    # Require a password in production. Set REDIS_PASSWORD in .env; the app
    # services read it via REDIS_URL (see .env.example).
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--requirepass',
        '${REDIS_PASSWORD:?set REDIS_PASSWORD in .env for production}',
      ]
    # The base healthcheck is `redis-cli ping`, which returns NOAUTH once a
    # password is set — override it to authenticate, or Redis never goes
    # healthy and dependents (condition: service_healthy) never start.
    healthcheck:
      test: ['CMD', 'redis-cli', '--no-auth-warning', '-a', '${REDIS_PASSWORD}', 'ping']
